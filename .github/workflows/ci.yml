name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check on the tagged commit before it publishes.
  workflow_call:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      # Replaces `cargo test`: the same tests, instrumented. The fragment waits in
      # RUNNER_TEMP until every step in the job has passed (see the collect step).
      - name: Test with coverage (eng-metrics-lab)
        run: cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
      - run: cargo build -p padel-scoring --target wasm32-unknown-unknown --locked
      - run: cargo build -p padel-scoring-wasm --target wasm32-unknown-unknown --locked
      # Only reached when every step above passed, so a red test leaves no fragment.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-fragments-rust
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.97" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-cache keeps ~/.cargo/bin, so the wasm-bindgen-cli install below is cached too.
          cache-bin: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Must match the wasm-bindgen pin in crates/scoring-wasm/Cargo.toml (build-wasm.sh checks).
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bash scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      # eng-metrics-lab: the test run itself writes the lcov, so the tests run once. The flags
      # ride after '--' so local `npm test` is unchanged.
      - name: Test with coverage (eng-metrics-lab)
        run: >-
          npm test -- --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcovonly
          --coverage.reportsDirectory="$RUNNER_TEMP/coverage-ts" '--coverage.include=src/**'
        working-directory: web
      - run: npm run build
        working-directory: web
      # Only reached when every step above passed. vitest writes SF paths relative to web/;
      # the report wants them relative to the repo root.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          sed 's#^SF:\([^/]\)#SF:web/\1#' "$RUNNER_TEMP/coverage-ts/lcov.info" > "$RUNNER_TEMP/coverage-ts.lcov"
          mv "$RUNNER_TEMP/coverage-ts.lcov" .quality/coverage-ts.lcov
      # eng-metrics-lab (report-only): knip's dead-code JSON. Runs via npx, not as a devDependency.
      - name: Dead code (eng-metrics-lab)
        continue-on-error: true
        run: |
          mkdir -p ../.quality
          npx --yes knip@5.88.1 --reporter json --no-exit-code > ../.quality/deadcode-ts.json
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: quality-fragments-web
          path: |
            .quality/coverage-ts.lcov
            .quality/deadcode-ts.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  commit-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Conventional Commits subjects on every commit since the rule was adopted (CLAUDE.md).
      - run: sh scripts/ci/commit-subjects.sh
      - run: for t in scripts/ci/*.test.sh; do bash "$t" || exit 1; done

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # eng-metrics-lab: duplication, complexity, dead code and coverage, ratcheted against
  # .quality-baseline.json; the collector picks up the quality-report artifact. It runs on
  # a red run too (coverage is then null) so the report is still published.
  quality:
    needs: [checks, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-fragments-*
          merge-multiple: true
          path: .quality
        continue-on-error: true
      - uses: jfms7s/eng-metrics-lab/action@v0
