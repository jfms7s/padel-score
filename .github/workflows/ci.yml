name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check on the tagged commit before it publishes.
  workflow_call:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.97" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build -p padel-scoring --target wasm32-unknown-unknown --locked
      - run: cargo build -p padel-scoring-wasm --target wasm32-unknown-unknown --locked

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.97" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rust-cache keeps ~/.cargo/bin, so the wasm-bindgen-cli install below is cached too.
          cache-bin: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Must match the wasm-bindgen pin in crates/scoring-wasm/Cargo.toml (build-wasm.sh checks).
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bash scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  commit-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Conventional Commits subjects on every commit since the rule was adopted (CLAUDE.md).
      - run: sh scripts/ci/commit-subjects.sh
      - run: for t in scripts/ci/*.test.sh; do bash "$t" || exit 1; done

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
