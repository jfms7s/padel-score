# The Wear OS app. Separate from ci.yml so it never gates the server image release
# (release.yml calls ci.yml, and the image doesn't contain the watch).
name: Watch
on:
  push:
    branches: [main]
    # GitHub ignores the paths filter on tag pushes, so every v* tag builds a signed APK.
    tags: ["v*"]
    paths:
      - "watch/**"
      - "web/src/lib/fixtures/**"
      - ".github/workflows/watch.yml"
  pull_request:
    paths:
      - "watch/**"
      - "web/src/lib/fixtures/**"
      - ".github/workflows/watch.yml"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar; the cache is read-only outside the default branch.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Signs the APK with the owner's key so each CI build installs over the last one and keeps
      # the watch's sign-in. Runs only on pushes to main and tags, never on pull requests, so a
      # fork PR never sees the secrets; without them the build uses the runner's debug key.
      #
      # Owner setup, once:
      #   keytool -genkeypair -v -keystore padel-watch.jks -alias padel-watch \
      #     -keyalg RSA -keysize 4096 -validity 10000
      #   Add repository secrets: WATCH_KEYSTORE_B64 (output of `base64 -w0 padel-watch.jks`),
      #   WATCH_KEYSTORE_PASSWORD, WATCH_KEY_ALIAS (padel-watch), WATCH_KEY_PASSWORD.
      #   Keep padel-watch.jks somewhere safe and never commit it. Losing it means one
      #   reinstall of the app and a new sign-in, nothing worse.
      - name: Load the signing key
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          KEYSTORE_B64: ${{ secrets.WATCH_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WATCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATCH_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::WATCH_KEYSTORE_B64 is not set; the APK is signed with the debug key."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::WATCH_KEYSTORE_B64 is set but another WATCH_KEY* secret is missing."
            exit 1
          fi
          keystore="$RUNNER_TEMP/padel-watch.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            echo "WATCH_KEYSTORE_PATH=$keystore"
            echo "WATCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "WATCH_KEY_ALIAS=$KEY_ALIAS"
            echo "WATCH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: watch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: padel-score-watch-debug-${{ github.sha }}
          path: watch/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watch-reports
          path: watch/app/build/reports/
