org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The server the watch talks to. Override for an emulator: -PpadelServerUrl=http://10.0.2.2:8080
padelServerUrl=https://padel.example.com
# LAN addresses of the server's ingress, tried when the watch's DNS can't give a LAN answer (the
# phone's Bluetooth proxy hands the watch DNS servers that only know the public one). TLS is still
# checked against the host name above. Leave empty to rely on DNS alone.
padelServerFallbackIps=192.168.50.231,192.168.50.201,192.168.50.202,192.168.50.203,192.168.50.200,192.168.50.101,192.168.50.11
