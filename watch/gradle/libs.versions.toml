[versions]
agp = "9.4.1"
kotlin = "2.4.21"
wear-compose = "1.7.1"
compose-bom = "2026.09.00"
wear-tooling-preview = "1.0.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
