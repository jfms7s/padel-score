[workspace]
resolver = "3"
members = ["crates/scoring", "crates/scoring-wasm", "crates/server"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Smaller wasm for the browser; scoped so other crates are unaffected.
[profile.release.package.padel-scoring-wasm]
opt-level = "z"
